; ============================================================
; edgetunnel 订阅转换配置（后端：https://api.v1.mk）
; 用法：本文件的 raw 链接填入 edgetunnel /admin → 订阅转换配置 → SUBCONFIG
; 说明：
;   1. DNS 不在这里配（api.v1.mk 后端会忽略 clash_rule_base 远程模板），
;      由 _worker.js 热补丁的 baseDnsBlock 注入 trli 双 DoH。
;   2. 本文件只负责：自动测速组 + 分流规则 + 节点名处理。
; ============================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ---------- 代理分组（自动测速核心） ----------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动测速`[]DIRECT`.*
custom_proxy_group=♻️ 自动测速`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动测速`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]♻️ 自动测速
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; ---------- 分流规则（在线列表，国内可直取） ----------
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaCompanyIp.list
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyLite.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ---------- 节点名处理 ----------
add_emoji=true
remove_old_emoji=true
emoji=(?i)(香港|hk|hong),🇭🇰,(?i)(东京|日本|jp|tokyo),🇯🇵,(?i)(美国|洛杉矶|圣何塞|us|usa|america),🇺🇸,(?i)(新加坡|sg|singapore),🇸🇬,(?i)(韩国|首尔|kr|seoul),🇰🇷,(?i)(德国|法兰克福|de|frankfurt),🇩🇪,(?i)(英国|伦敦|gb|uk|london),🇬🇧,(?i)(流量|剩余|时间|到期|通知|频道),📢

sort=true
